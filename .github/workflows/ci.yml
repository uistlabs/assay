name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync (incl. dev group)
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q
