[project]
name = "assay"
version = "0.2.0"
description = "NVFP4 quantization + benchmark-gated publishing pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["quantization", "nvfp4", "llm", "vllm", "llm-compressor", "lm-eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llmcompressor>=0.6.0",
    "lm-eval>=0.4.5",
    "transformers>=4.48",
    "torch>=2.5",
    "datasets>=3.0",
    "huggingface-hub>=0.27",
    "runpod>=1.7",
]

[project.urls]
Homepage = "https://github.com/uistlabs/assay"
Repository = "https://github.com/uistlabs/assay"
"Published model" = "https://huggingface.co/uist-labs/Qwen2.5-7B-Instruct-NVFP4A16"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]
