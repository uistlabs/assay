[project]
name = "assay"
version = "0.6.2"
description = "NVFP4 quantization + benchmark-gated publishing pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["quantization", "nvfp4", "llm", "vllm", "llm-compressor", "lm-eval"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Floors track the certified set in deploy/constraints.txt (exact pins + per-pin
    # rationale live there; the image build-gate asserts them). Floors here keep a
    # fresh dev env from resolving anything older than what certification runs on -
    # ">=0.6.0" was satisfied by the tested 0.12 only by luck (F-006).
    "llmcompressor>=0.12",
    "lm-eval>=0.4.12",
    "transformers>=4.48",
    "torch>=2.5",
    "datasets>=3.0",
    "huggingface-hub>=0.27",
    "runpod>=1.7",
    # The gate's statistics library: the certification decision rests on
    # scipy.stats.sem (paired significance test, BITE 2). Was transitive-only via
    # lm-eval (F-011) - the thing the verdict rests on is declared, not inherited.
    "scipy>=1.18",
]

[project.urls]
Homepage = "https://github.com/uist-labs/assay"
Repository = "https://github.com/uist-labs/assay"
"Published model" = "https://huggingface.co/uist-labs/Qwen2.5-7B-Instruct-NVFP4A16"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]
